name: "Trivy SCA Scan Action"
description: "Reusable action for Trivy filesystem SCA"
inputs:
  severity:
    description: "Severity levels to report."
    required: false
    default: "HIGH,CRITICAL"
  scanners:
    description: "Trivy scanners to enable (e.g., vuln,secret,config)."
    required: false
    default: "vuln,secret"
  skip_dirs:
    description: "Comma-separated list of directories to skip during the scan."
    required: false
    default: "venv,.venv,.tox,.eggs,build,dist,__pycache__"

outputs:
  sarif_file:
    description: "Generated SARIF file"
    value: trivy-results.txt
    
runs:
  using: "composite"
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        set -euo pipefail
        VERSION="0.69.3"
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
          -o trivy.tgz
        sudo tar -C /usr/local/bin -xzf trivy.tgz trivy
        trivy --version    
        
    - name: Run Trivy SCA 
      shell: bash
      env:
        COMPONENT_PATH: "."
      run: |
        trivy fs \
          --scanners "${{ inputs.scanners }}" \
          --vuln-type library \
          --severity "${{ inputs.severity }}" \
          --ignore-unfixed \
          --list-all-pkgs \
          --skip-dirs "${{ inputs.skip_dirs }}" \
          --format table \
          . | tee "trivy-results.txt"

    
       
