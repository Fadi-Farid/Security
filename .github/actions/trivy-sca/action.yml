name: "Trivy SCA Scan Action"
description: "Reusable action for Trivy filesystem SCA"
inputs:
  severity:
    description: "Severity levels to report."
    required: false
    default: "HIGH,CRITICAL"
  scanners:
    description: "Trivy scanners to enable (e.g., vuln,secret,config)."
    required: false
    default: "vuln,secret"
  skip_dirs:
    description: "Comma-separated list of directories to skip during the scan."
    required: false
    default: "venv,.venv,.tox,.eggs,build,dist,__pycache__"
  skip_files:
    description: "Comma-separated list of files to skip during the scan."
    required: false
    default: ""
  version:
    description: "Trivy version to install (e.g., 0.69.3). If set to 0.69.4, installation is skipped."
    required: false
    default: "0.69.3"

outputs:
  trivy-results:
    description: "Generated SARIF file"
    value: trivy-results.txt
    
runs:
  using: "composite"
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        set -euo pipefail
        REQ_VERSION="${{ inputs.version }}"
        if [[ "$REQ_VERSION" == "0.69.4" ]]; then
          echo "Requested version is 0.69.4 → skipping installation as requested."
        else
          echo "Installing Trivy $REQ_VERSION ..."
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${REQ_VERSION}/trivy_${REQ_VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tgz
          sudo tar -C /usr/local/bin -xzf trivy.tgz trivy
          trivy --version    
        fi
        
    - name: Run Trivy SCA 
      shell: bash
      env:
        COMPONENT_PATH: "."
      run: |
        trivy fs \
          --scanners "${{ inputs.scanners }}" \
          --vuln-type library \
          --severity "${{ inputs.severity }}" \
          --ignore-unfixed \
          --list-all-pkgs \
          --skip-dirs "${{ inputs.skip_dirs }}" \
          --skip-files "${{ inputs.skip_files }}" \
          --format table \
          . | tee "trivy-results.txt"

    
       
