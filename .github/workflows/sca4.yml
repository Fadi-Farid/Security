name: Trivy SCA (JSON report)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  sca:
    name: Trivy SCA (fs → JSON)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.69.3"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tgz
          sudo tar -C /usr/local/bin -xzf trivy.tgz trivy
          trivy --version

      - name: Run Trivy SCA (fs → JSON)
        env:
          COMPONENT_NAME: "repo-root"
          COMPONENT_PATH: "."
        run: |
          trivy fs \
            --scanners vuln \
            --vuln-type library \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs "venv,.venv,.tox,.eggs,build,dist,__pycache__" \
            -f json -o "trivy-${COMPONENT_NAME}.json" \
            "${COMPONENT_PATH}"

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json
          path: trivy-*.json
          if-no-files-found: error

      - name: Add quick summary to job
        run: |
          FILE="trivy-repo-root.json"
          if command -v jq >/dev/null 2>&1; then
            TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$FILE")
            echo "### Trivy SCA (repo-root)" >> "$GITHUB_STEP_SUMMARY"
            echo "Findings (LOW..CRITICAL): **$TOTAL**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Install jq to print a summary" >> "$GITHUB_STEP_SUMMARY"
          fi
