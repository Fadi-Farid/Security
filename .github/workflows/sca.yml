name: 'Trivy SCA Scan'
on:
  push:
  pull_request:

jobs:
  trivy-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy SCA Scan Action
        id: trivy
        permissions:
          contents: read
          actions: read
          security-events: write
        uses: ./.github/actions/trivy-sca   
        with:
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4 
        with:
            sarif_file: ${{ steps.trivy.outputs.sarif_file }}
