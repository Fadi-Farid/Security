name: ZAP DAST Scan

on:
  push:

jobs:
  zap-dast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Run ZAP Baseline Scan
      #   uses: zaproxy/action-baseline@v0.15.0
      #   with:
      #     target: https://juice-shop.herokuapp.com
      #     cmd_options: "-a"
      #     fail_action: false   # ✅ IMPORTANT

      # - name: Install OWASP ZAP
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y zaproxy


      # ✅ Move reports from container to workspace
      - name: Prepare reports
        if: always()
        run: |
          mkdir -p zap-reports
          cp -r /home/runner/work/_temp/_github_home/.ZAP/* zap-reports/ || true
          ls -R zap-reports || true
          
      - name: Run ZAP Baseline Scan
        uses: ./.github/actions/zap-type
        with:
          target: "https://example.com"
          rules-file-name: "rules.conf"
          
      - name: debug
        if: always()
        run: |
          ls -lah zap-reports 


      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-reports/

      # ✅ Summary (based on JSON if available)
      - name: Publish Summary
        if: always()
        run: |
          echo "<h2>🔐 OWASP ZAP Report</h2>" >> $GITHUB_STEP_SUMMARY

          FILE="zap-reports/report.json"

          if [ -z "$FILE" ]; then
            echo "<p>⚠️ No ZAP report found.</p>" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
            HIGH=$(jq '[.site[].alerts[]? | select(.riskcode=="3")] | length' report.json)
              MEDIUM=$(jq '[.site[].alerts[]? | select(.riskcode=="2")] | length' report.json)
              LOW=$(jq '[.site[].alerts[]? | select(.riskcode=="1")] | length' report.json)
              INFO=$(jq '[.site[].alerts[]? | select(.riskcode=="0")] | length' report.json)
          
              {
                echo "## 🔐 OWASP ZAP Results"
                echo ""
                echo "| Severity | Count |"
                echo "|----------|-------|"
                echo "| 🔴 High | $HIGH |"
                echo "| 🟠 Medium | $MEDIUM |"
                echo "| 🟡 Low | $LOW |"
                echo "| 🔵 Info | $INFO |"
              } >> "$GITHUB_STEP_SUMMARY"
           
          echo "<p>📄 Download artifact <b>zap-dast-report</b> to view the full HTML report.</p>" >> "$GITHUB_STEP_SUMMARY"
          

