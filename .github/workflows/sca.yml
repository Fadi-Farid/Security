name: Trivy SCA Scan
on:
  push:
  pull_request:
jobs:
  trivy-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # 1. SCA: Scan dependencies (NPM relevant)
      - name: Trivy SCA Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: "fs"           # Scan repo filesystem
          scanners: "vuln,secret"   # Enable SCA + secret scans
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: 1