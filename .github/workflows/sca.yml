name: Trivy SCA Scan   # <-- Workflow Name

on:
  push:

jobs:
  trivy-sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      - name: Prepare ZAP workspace
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          chmod 777 ${{ github.workspace }}/zap-reports
      
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://juice-shop.herokuapp.com
          workdir: ${{ github.workspace }}/zap-reports
          cmd_options: "-a"
          fail_action: true
          rules_file_name: zap-rules.conf


      - name: zap-dast-report-${{ github.run_id }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap_report.html
            zap_report.json
            
      - name: Publish ZAP Report link
        if: always()
        run: |
          echo "## 🔐 DAST Report (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The OWASP ZAP HTML report has been generated and uploaded as a workflow artifact." >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact **zap-dast-report** and open \`zap-reports/zap_report.html\` in a browser to review the results." >> $GITHUB_STEP_SUMMARY
          
      - name: Publish ZAP Summary
        if: always()
        run: |
          echo "<h2>🔐 OWASP ZAP Report</h2>" >> $GITHUB_STEP_SUMMARY
          echo "<p>✅ Full interactive HTML report available:</p>" >> $GITHUB_STEP_SUMMARY
          echo "<ul>" >> $GITHUB_STEP_SUMMARY
          echo "<li>Download artifact: <b>zap-dast-report</b></li>" >> $GITHUB_STEP_SUMMARY
          echo "<li>Open <code>zap-reports/zap_report.html</code> in your browser</li>" >> $GITHUB_STEP_SUMMARY
          echo "</ul>" >> $GITHUB_STEP_SUMMARY



      
      - name: Show partial HTML report
        if: always()
        run: |
          echo "<details><summary><b>🔎 View Partial HTML Report</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "<br>" >> $GITHUB_STEP_SUMMARY
      
          # Extract body (basic)
          sed -n '/<body>/,/<\/body>/p' zap_report.html | head -200 >> $GITHUB_STEP_SUMMARY
      
          echo "</details>" >> $GITHUB_STEP_SUMMARY
      
                
      - name: Extract readable content
        run: |
          echo "## 📄 ZAP Report (Extract)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
          sed 's/<[^>]*>//g' zap_report.html | head -200 >> $GITHUB_STEP_SUMMARY
      
      
      - name: Publish ZAP Summary (HTML)
        run: |
          echo "<h2>🔐 OWASP ZAP Report</h2>" >> $GITHUB_STEP_SUMMARY
      
          echo "<p><b>Quick summary available below.</b></p>" >> $GITHUB_STEP_SUMMARY
      
          echo "<p>📄 Full report:</p>" >> $GITHUB_STEP_SUMMARY
          echo "<ul>" >> $GITHUB_STEP_SUMMARY
          echo "<li>Download artifact: <b>zap-dast-report</b></li>" >> $GITHUB_STEP_SUMMARY
          echo "<li>Open <code>zap-reports/zap_report.html</code></li>" >> $GITHUB_STEP_SUMMARY
          echo "</ul>" >> $GITHUB_STEP_SUMMARY

        
      - name: Publish ZAP Summary (HTML)
        if: always()
        run: |
          echo "<h2>🔐 DAST Report (OWASP ZAP)</h2>" >> $GITHUB_STEP_SUMMARY
      
          if [ ! -f zap-reports/zap_report.json ]; then
            echo "<p>⚠️ No ZAP report found.</p>" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
      
          HIGH=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("High"))] | length' zap-reports/zap_report.json)
          MEDIUM=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Medium"))] | length' zap-reports/zap_report.json)
          LOW=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Low"))] | length' zap-reports/zap_report.json)
          INFO=$(jq '[.site[].alerts[] | select(.riskdesc | startswith("Informational"))] | length' zap-reports/zap_report.json)
      
          echo "<table>" >> $GITHUB_STEP_SUMMARY
          echo "<tr><th>Severity</th><th>Count</th></tr>" >> $GITHUB_STEP_SUMMARY
          echo "<tr><td>🔴 High</td><td>$HIGH</td></tr>" >> $GITHUB_STEP_SUMMARY
          echo "<tr><td>🟠 Medium</td><td>$MEDIUM</td></tr>" >> $GITHUB_STEP_SUMMARY
          echo "<tr><td>🟡 Low</td><td>$LOW</td></tr>" >> $GITHUB_STEP_SUMMARY
          echo "<tr><td>ℹ️ Info</td><td>$INFO</td></tr>" >> $GITHUB_STEP_SUMMARY
          echo "</table>" >> $GITHUB_STEP_SUMMARY
      
          echo "<p>📄 Download <b>zap-dast-report</b> artifact to view the full HTML report.</p>" >> $GITHUB_STEP_SUMMARY
      


